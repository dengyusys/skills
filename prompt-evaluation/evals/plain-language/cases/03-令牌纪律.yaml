description: 设计令牌原则与纪律（等号当动词/压缩词/括号嵌套）
vars:
  request: 这段文档读起来太费劲了，帮我改成说人话的版本，顺一遍。内容别丢。
  doc: |
    > 原则：**全面覆盖来自 L1 色阶，颜色统一来自 L2 语义层**。组件只准消费 L2；soft 背景一律 `color-mix` 派生，不手调、不逐主题复制。一个健康的系统里，组件消费的颜色变量数量有界（本库 21 个），且换主题 = 换 L1 标尺、L2 槽位映射不变。

    ……（令牌纪律节选）……

    3. **不加"一组件一色"变量**：需要新的状态底色用 `color-mix` 派生；需要新语义先问能否映射到现有槽位。
    6. **三页一制**：所有页面（含移动端、图标页）消费同一套语义层；单主题页面只写所需 L1 档位，**但 L2 语义槽位必须整块复制**（压测教训：按需裁剪 L2 会在用到 `--danger` 时静默失效——要么整块带走，要么显式注明缺省）。
    7. **结构嵌套纪律**：`<button>` 内禁止再出现交互元素；复合行（会话项含删除按钮）用 `div[role=button] + tabindex=0 + Enter/Space 键盘路径`，内部放真正的 `<button>`（压测教训）。
assert:
  - type: llm-rubric
    value: |
      你是阅卷员。以下问题必须能只从改写后的文本中读到明确依据；依据与标准答案不符算失败。逐问核对：
      1. 组件允许从哪层取色、禁止用哪层？标准：只能用 L2 语义层；禁止直接用 L1 色阶。
      2. soft 背景色怎么产生？标准：用 color-mix 派生，不手动调、不逐主题复制。
      3. 换主题时变什么、不变什么？标准：只换 L1 标尺；L2 槽位映射不变。
      4. 只复制用到的 L2 变量会有什么后果、两个解法是什么？标准：用到 --danger 时会静默失效；解法是整块带走或显式注明缺省。
      5. 复合行（如带删除按钮的会话项）怎么写？标准：外层用 div[role=button] 加 tabindex=0 并支持 Enter/Space 键盘操作，内部放真正的 button。
