description: 提案卡与文件列表行配方（箭头链/斜杠并列/状态机电报腔）
vars:
  request: 这段文档读起来太费劲了，帮我改成说人话的版本，顺一遍。内容别丢。
  doc: |
    ### 3.6 提案卡（确认制交互的核心组件）
    结构：头部（分类 + mono 日期）→ 字段行（字段名 / old / → / new）→ 操作行（取消 ghost / 确认 primary）→ 底部状态脚。
    状态机：`pending → .done`（行变绿 ✓、按钮移除、脚"已安全写入 ✓ 时间"）/ `.cancelled`（整卡降透明度）。字段行错峰入场 `animation-delay: i*70ms`。（来源：`interfaces/ai-steward-mobile` `.card-proposal`）

    ### 3.13 文件列表行（状态机）
    `名称(ellipsis)/大小/状态/时间/删除(hover 显示)`；状态三点式：`解析中`（琥珀 + 呼吸点）→ `已就绪`/`失败`，落定时 toast；上传区有文件后**收缩为细条**（渐进披露）。（来源：`ai-hub` `.f-row`）
assert:
  - type: llm-rubric
    value: |
      你是阅卷员。以下问题必须能只从改写后的文本中读到明确依据（原文里有而改写稿里读不出的，算失败）；依据与标准答案不符也算失败。逐问核对：
      1. 用户确认之后，卡片上发生哪些变化？标准：那一行变绿并显示对勾、操作按钮消失、底部显示已安全写入及时间。
      2. 用户取消之后卡片什么样？标准：整卡透明度降低（变淡）。
      3. 多条字段行同时入场怎么安排？标准：依次错开入场，每行延迟按 i*70ms（animation-delay）计算。
      4. 文件列表行有哪几列？删除按钮何时出现？标准：名称、大小、状态、时间、删除；鼠标悬停时才显示。
      5. 文件状态有哪几种、落定时发生什么？标准：解析中、已就绪、失败；落定时弹 toast 提示。
