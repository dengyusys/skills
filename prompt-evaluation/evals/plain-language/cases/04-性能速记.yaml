description: 性能与鲁棒速记条目（无主语电报句/速记黑话：墙钟推进/漂移/辩护例外）
vars:
  request: 这段文档读起来太费劲了，帮我改成说人话的版本，顺一遍。内容别丢。
  doc: |
    **通用机制以类为单位复用，不复制声明**——自写副本会漂移（记忆面板冻结事故）。

    ## 5. 性能与鲁棒

    - 只动 `transform`/`opacity`（合成器）；**grid-rows 是唯一辩护例外**（高度显隐无替代方案，实测 8.3ms 帧间隔中位数）。
    - 打字机/流式：墙钟推进（`performance.now()`），绝不固定步进——后台定时器被节流到 1 次/秒，固定步进会拖死。
    - VT 可用性运行时探测：`ready` 拒绝 **或 `finished` 先于 `ready` 落定**（某些环境 ready 永不落定）= 不可用，学习一次后续直接走降级。
    - 遮挡标签页里主线程过渡全部冻结、rAF 停摆——**布局动画必须在面板可见时验证**。
assert:
  - type: llm-rubric
    value: |
      你是阅卷员。以下问题必须能只从改写后的文本中读到明确依据；依据与标准答案不符算失败。逐问核对：
      1. 动画只允许改哪两个属性、为什么？grid-rows 为何例外？标准：transform 和 opacity（由合成器处理）；grid-rows 是唯一例外，因为高度显隐没有替代方案。
      2. 流式输出为什么不能按固定步长推进、该怎么做？标准：后台标签页的定时器被节流到每秒一次，固定步长会被拖慢；应按真实时间（performance.now()）推进。
      3. 判定视图切换接口不可用的两个信号？标准：ready 被拒绝，或 finished 比 ready 先落定；且学习一次后直接走降级。
      4. 为什么布局动画必须在面板可见时验证？标准：页面被遮挡时主线程过渡全部冻结、逐帧回调停摆，会测出假结果。
