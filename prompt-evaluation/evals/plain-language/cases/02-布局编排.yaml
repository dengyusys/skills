description: 布局编排规则（自创黑话群：错峰/让位者/反向镜像）
vars:
  request: 这段文档读起来太费劲了，帮我改成说人话的版本，顺一遍。内容别丢。
  doc: |
    ### 4.5 布局编排（多段高度变化必须错峰）

    凡一个状态切换引发**多段高度变化**（如：终端块收起 + 表单折叠 + 卡片生长），必须错峰编排——同时进行时，上方元素长高会把正在收缩的下方元素往下推，两个位移互相打架（"僵硬感"的来源）：

    - **正向**：让位者先收（280ms）→ 240ms 后新内容生长；滚动定位延迟到全部稳定后（~520ms）；
    - **反向镜像**：新内容先收 → 240ms 后让位者展开——正反向同一节奏，不要只编排一边；
    - 高度显隐一律 `collapse-wrap`（4.1 的例外辩护），`display` 切换会把整块高度瞬插/瞬删（"入场动画不动画布局"）。
assert:
  - type: llm-rubric
    value: |
      你是阅卷员。以下问题必须能只从改写后的文本中读到明确依据；依据与标准答案不符算失败。逐问核对：
      1. 为什么不能同时动？标准：同时进行时上方元素长高会把正在收缩的下方元素往下推，两个位移互相打架，产生僵硬感。
      2. 正向切换的时序？标准：让位者先收（280ms）；240ms 后新内容生长；全部稳定后（约 520ms）才做滚动定位。
      3. 反向切换的时序？标准：新内容先收，240ms 后让位者展开，与正向镜像。
      4. 高度显隐用什么机制、为什么不用 display 切换？标准：用 collapse-wrap；display 切换会让高度瞬间插入或消失。
