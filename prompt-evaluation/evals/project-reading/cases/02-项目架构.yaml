description: 项目架构（组成部分、连接方式、数据流动）
vars:
  request: 带我理解这个系统的架构：有哪些部分、怎么连接的、一次日程记录从输入到落库的完整数据流是什么样？
  code: |
    目录结构（节选）：
    apps/
    ├─ gateway/src/
    │   ├─ domains/schedule/    # 日程域：写入队列、记录更新、校验、路由
    │   ├─ domains/proposals/   # 提案域：解析、校验、存储、路由
    │   └─ domains/memory/      # 记忆域：仓库、执行器、上下文组装
    │   └─ infrastructure/ai/   # AI 调用封装
    ├─ web/src/                 # React 单页应用（月历 / 录入 / 记忆三 Tab）
    └─ memory/                  # 独立记忆服务
    data/
    ├─ schedule/schedule.db     # 日程 SQLite（唯一运行时日程数据源）
    └─ memory/memory.db         # 记忆 SQLite
    schemas/                    # 数据结构定义
    test/                       # 跨包集成测试

    模块连接关系（摘自项目文档）：
    - Web（浏览器端 React 应用）只通过 HTTP 调用 Gateway 的 API，自己不碰任何数据库。
    - Gateway 是唯一在线日程读写入口，内部按业务分为 schedule / proposals / memory 三个域。
    - Gateway 调用外部 AI provider 生成结构化提案（AI 无文件、无路径、无工具权限）。
    - Gateway 的记忆域进程内连接 Memory 服务读写 memory.db。
    - 用户在 Web 上核对提案差异并确认后，Gateway 才执行写入：串行队列 + 事务 + 冲突检测。
    - 每次写入带 requestId，Gateway 按 requestId 做进程内幂等去重。
  strategy: （首轮运行，暂无历史策略，按固定规则执行。）
assert:
  - type: llm-rubric
    value: 用基础 ASCII 字符（+ - | > 等）画出了 Web / Gateway / AI / Memory / 两个 SQLite 之间的连接与数据流向，组件与材料一致，没有编造材料里不存在的组件
  - type: llm-rubric
    value: 完整走通一次数据流：用户自然语言输入 → AI 生成提案 → 用户核对确认 → Gateway 串行队列写入 schedule.db，每一步讲清"为什么要有这一步"，不跳步
  - type: llm-rubric
    value: 开篇一句话点明架构整体形态（例如"一个前端应用 + 一个网关服务 + 一个记忆服务"），之后按模块或按数据流组织，读者始终知道自己在地图的哪个位置
