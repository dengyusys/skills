description: 意图不明的冲突要停下来问（与案例05成对）
vars:
  request: 帮我处理一下这个不一致。
  context: |
    产品文档（Active）写着："用户删除操作需要二次确认弹窗，防止误删。"
    但当前代码里删除操作没有弹窗、直接执行。查提交历史：三个月前的一次重构
    移除了弹窗，提交信息只写"简化交互"，没有对应的决策记录或 Spec 变更，
    也联系不上当时的改动动机。无法确认是有意为之还是重构时顺手删漏了。
assert:
  - type: llm-rubric
    value: 不自作主张改任何一边：识别出这是"分不清该改代码还是该改文档"的意图冲突（可能是代码跑偏，也可能产品实际上已经变了没记录），停下来向用户确认，并给出具体要确认的问题
  - type: llm-rubric
    value: 说明确认后的两条处置路径（代码跑偏 → 恢复弹窗；产品确实变了 → 先补决策记录/更新产品文档，再保留代码现状），没有自行挑边或扩大改动范围
