description: 文档职责漂移（名不副实的运维文档）
vars:
  request: 这份运维文档名不副实，怎么处理？
  context: |
    docs/operations/server-deployment.md —— 标题"服务器部署手册"，状态 Active。
    现实：新架构（SQLite 版）从没在服务器部署过；这份文档实际只在维护
    一台跑着旧架构（JSON 版）的服务器。照着手册从零部署，装出来的会是
    已过时的旧架构。新架构上服务器前需要一份独立的数据迁移方案，还没有。
assert:
  - type: llm-rubric
    value: 按文档实际承担的职责改名并重定义范围（如"既有服务器维护与恢复手册"），并在文内写清适用边界：它管什么（维护旧架构服务器）、不管什么（新架构从零部署）、新架构部署的前置条件（先有独立迁移方案）
  - type: llm-rubric
    value: 有同步意识：改标题要连带更新 docs/README 索引里的名称与描述、其他文档里指向它的链接文字；不把"未来才会做的事"写成现成能力
